[project]
name = "hotel-guest-experience-platform"
version = "1.0.0"
description = "Thesis-derived hotel service operations portfolio prototype"
requires-python = ">=3.11,<3.15"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["app"]
omit = ["app/cli.py"]
